name: SINERGY Messenger v0.2 Native

on:
  push:
    branches: [sinergy-messenger-v0.2-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/sinergy-messenger
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Compile native release APK
        run: gradle :app:assembleRelease --stacktrace --warning-mode all

      - name: Verify physical native payload
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libtdjni.so'
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex'
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          du -h "$APK"

      - name: Upload unsigned native build
        uses: actions/upload-artifact@v4
        with:
          name: sinergy-messenger-v0.2-native-unsigned
          path: |
            apps/sinergy-messenger/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/sinergy-messenger/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
